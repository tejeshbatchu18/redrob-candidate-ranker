ai_usage_summary: |
  Used Claude for architecture discussion, code review, and drafting the
  approach deck. The ranking logic is rule-based and runs locally; no candidate
  data is sent to any LLM, and no LLM is called during ranking.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Hybrid, explainable ranker. The JD is compiled offline into a structured rubric
  (must-haves, disqualifiers, locations, weights). Candidates pass through hard
  gates first: honeypots (impossible tenure, expert-skill-with-zero-months) and
  JD disqualifiers (non-technical title, services-only career, pure research,
  off-domain) are dropped, not merely scored down. Survivors are scored on six
  signals — career-history evidence (weighted highest), trust-weighted skill
  coverage, semantic similarity (precomputed sentence-transformer + FAISS, or a
  TF-IDF fallback), seniority band, trajectory/loyalty, and location. A per-skill
  endorsement x duration trust multiplier defuses keyword-stuffers; reading career
  text rather than the skills list surfaces plain-language strong fits. The fit
  score is multiplied by a behavioral-availability modifier (response rate,
  recency, open-to-work) so inactive perfect-on-paper profiles are down-weighted.
  Every row ships a deterministic, profile-grounded reason (no hallucination).
  Runs on CPU, no network, in minutes for 100K candidates.

